name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: vet, staticcheck, race tests, real APKs, README examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./...
      # The three real APKs are fetched from F-Droid and checked against the
      # SHA-256 hashes F-Droid's index publishes. Cached on the hash list, so
      # F-Droid's server is only needed the first time (it has returned
      # 504s); a changed hash list re-fetches.
      - uses: actions/cache@v4
        with:
          path: .apks
          key: apks-${{ hashFiles('testdata/apks.sha256') }}
      - run: ./testdata/fetch-apks.sh .apks
      - run: go test -race ./...
        env:
          APKWARDEN_APKS: ${{ github.workspace }}/.apks
      - run: go build -o bin/apkwarden ./cmd/apkwarden
      - name: The README's example output matches the real tool
        run: PATH="$PWD/bin:$PATH" ./scripts/check-readme.sh
        env:
          APKWARDEN_APKS: ${{ github.workspace }}/.apks
      - name: Fuzz the whole pipeline briefly
        run: go test ./cmd/apkwarden -run '^$' -fuzz FuzzWholePipeline -fuzztime 30s

  secrets:
    name: credsweep over the full commit history
    runs-on: ubuntu-latest
    steps:
      # A shallow clone would let credsweep report a false all-clear.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - run: go install github.com/sriharifortitude/credsweep/cmd/credsweep@v0.1.2
      - run: credsweep scan .
